worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout   65;
    client_max_body_size 20M;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    server {
        # ${PORT} disisipkan oleh entrypoint memakai envsubst.
        listen      ${PORT};
        server_name _;
        root        /var/www/html/public;
        index       index.php;

        charset utf-8;

        # Berkas hasil build Vite bernama ber-hash, jadi aman di-cache lama.
        location /build/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files  $uri =404;
        }

        location = /favicon.svg { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;

            # Unduhan Excel dibangkitkan on-the-fly; beri tenggang lebih panjang.
            fastcgi_read_timeout 120s;
        }

        # Tutup akses ke berkas tersembunyi, kecuali .well-known.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
