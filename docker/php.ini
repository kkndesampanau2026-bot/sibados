; Pengaturan PHP untuk lingkungan produksi SIBADOS.
expose_php = Off
memory_limit = 256M
max_execution_time = 120

upload_max_filesize = 20M
post_max_size = 20M

; Galat dicatat ke stderr agar tertangkap log Railway, tidak ditampilkan ke pengguna.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = Asia/Makassar

; OPcache mempercepat eksekusi; validasi timestamp dimatikan karena kode
; tidak berubah selama container hidup.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
